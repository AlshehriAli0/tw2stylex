name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  tarball:
    name: the published package works
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # What ships is not this directory. The README and LICENSE are copied in by the pack
      # script, `files` decides what survives, and both ways of breaking it are invisible here
      # and only exist in the tarball. So this installs one into a bare project and drives it.
      - name: pack and install
        run: |
          bun run pack
          mkdir -p "$RUNNER_TEMP/consumer/app" "$RUNNER_TEMP/consumer/.claude"
          cd "$RUNNER_TEMP/consumer"
          echo '{"name":"c","version":"1.0.0","private":true}' > package.json
          echo 'module.exports={content:[],theme:{extend:{colors:{brand:"#0af"}}}};' > tailwind.config.js
          echo 'export const A = () => <div className="flex p-4 text-brand rotate-45" />;' > app/a.tsx
          npm i --silent "$GITHUB_WORKSPACE"/tw2stylex-*.tgz tailwindcss@^3

      - name: the skill ships and installs
        run: |
          cd "$RUNNER_TEMP/consumer"
          test -f node_modules/tw2stylex/README.md
          test -f node_modules/tw2stylex/LICENSE
          npx tw2stylex init
          test -f .claude/skills/migrating-tailwind-to-stylex/SKILL.md

      - name: the CLI converts and verifies
        run: |
          cd "$RUNNER_TEMP/consumer"
          npx tw2sx plan app --json | tee plan.json
          test "$(jq -r '.ok' plan.json)" = "true"
          test "$(jq -r '.summary.converted' plan.json)" = "1"

      # Tailwind 4 takes a different path through the resolver, so both majors get exercised.
      - name: Tailwind 4 too
        run: |
          cd "$RUNNER_TEMP/consumer"
          rm -f tailwind.config.js
          printf '@import "tailwindcss";\n' > app/globals.css
          npm i --silent tailwindcss@^4
          npx tw2sx plan app --css app/globals.css --json | jq -e '.ok == true'
